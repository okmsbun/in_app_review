name: tests
   
on:
  push:
  pull_request:
  
jobs:
  tests:
    strategy:
      matrix:
        flutter-version: ["3.44.0", "stable"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./in_app_review
    steps:
      - uses: actions/checkout@v2
      - uses: britannio/action-install-flutter@v1
        with:
          version: ${{ matrix.flutter-version }}
      - name: Get dependencies
        run: flutter pub get --no-example
      - name: Static Analysis
        run: flutter analyze --no-pub lib test
      - name: Run Tests
        run: flutter test --no-pub
          
  android_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./in_app_review/example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: britannio/action-install-flutter@v1
        with:
          version: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Build with built-in Kotlin and the new AGP DSL
        run: flutter build apk --debug --no-pub

  platform_interface_tests:
    strategy:
      matrix:
        flutter-version: ["3.24.5", "stable"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./in_app_review_platform_interface
    steps:
      - uses: actions/checkout@v2
      - uses: britannio/action-install-flutter@v1
        with:
          version: ${{ matrix.flutter-version }}
      - name: Get dependencies
        run: flutter pub get
      - name: Static Analysis
        run: flutter analyze --no-pub
      - name: Run Tests
        run: flutter test --no-pub
